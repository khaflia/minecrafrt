# =============================================
#         DhabiCore — khaleeji.lol
#         Dhabi's Server Core by kbk
# =============================================

# ---- Chat ----
chat:
  format: "%rank% &7%player%&f: &r%message%"
  join-message: "&b+ &f{player} &7joined the server!"
  quit-message: "&8- &7{player} left the server."

# ---- TPA ----
tpa:
  cooldown-seconds: 30
  expire-seconds: 60
  teleport-delay-seconds: 3

# ---- Homes ----
homes:
  default-max: 2
  teleport-delay-seconds: 3
  cancel-on-move: true

# ---- VeinMiner ----
veinminer:
  force-enabled: true
  always-active: true
  require-sneak: false
  require-permission: false
  diagonal-detection: true
  max-blocks: 64
  custom-ores: []
  world-blacklist:
    - world_nether

# ---- TreeFeller ----
treefeller:
  force-enabled: true
  always-active: true
  require-sneak: false
  require-permission: false
  require-axe: true
  min-leaves: 3
  diagonal-detection: true
  # Max allowed by safety cap: 512
  max-blocks: 128
  custom-logs: []
  allowed-axes: []
  world-blacklist:
    - world_nether

# ---- Scoreboard ----
scoreboard:
  title: "&b&lKhaleej &f&lSMP"
  # Refresh every N ticks (20 = 1 second)
  refresh-ticks: 40

# ---- RTP ----
rtp:
  radius: 2000
  max-tries: 80
