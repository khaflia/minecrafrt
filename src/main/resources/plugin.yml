name: DhabiCore
version: 1.0.0
main: me.kbk.dhabicore.DhabiCore
api-version: 1.20
description: "Dhabi's Minecraft Server Core Plugin by kbk — khaleeji.lol"
author: kbk

commands:
  tpa:
    description: Send or view TPA requests
    usage: /tpa [player]
    aliases: [tprequest]
  tpaccept:
    description: Accept a TPA request
    usage: /tpaccept
    aliases: [tpyes]
  tpadeny:
    description: Deny a TPA request
    usage: /tpadeny
    aliases: [tpno]
  sethome:
    description: Set a home at your current location
    usage: /sethome [name]
  home:
    description: Teleport to a home or open home GUI
    usage: /home [name]
  delhome:
    description: Delete a home
    usage: /delhome <name>
  menu:
    description: Open the main Dhabi Server menu
    usage: /menu
    aliases: [dhabi]
  setrank:
    description: Set a player's rank
    usage: /setrank <player> <rank>
    permission: dhabicore.admin
  veinminer:
    description: Toggle VeinMiner
    usage: /veinminer
    aliases: [vm]
  treefeller:
    description: Toggle TreeFeller
    usage: /treefeller
    aliases: [tf]
  zone:
    description: Manage protected zones
    usage: /zone <create|delete|list|info> [name]
    permission: dhabicore.zone
  pos1:
    description: Set zone selection position 1
    usage: /pos1
    permission: dhabicore.zone
  pos2:
    description: Set zone selection position 2
    usage: /pos2
    permission: dhabicore.zone
  fly:
    description: Toggle flight mode (staff and above)
    usage: /fly
  rtp:
    description: Teleport to a random safe location
    usage: /rtp
  protect:
    description: Get protection wand and create protected areas
    usage: /protect [create <name>]
    permission: dhabicore.zone

permissions:
  dhabicore.admin:
    description: Full admin access to DhabiCore
    default: op
  dhabicore.zone:
    description: Can create/delete protected zones
    default: op
  dhabicore.zone.bypass:
    description: Can build inside protected zones
    default: op
  dhabicore.homes.vip:
    description: VIP home limit (3 homes)
    default: false
  dhabicore.homes.mvp:
    description: MVP home limit (5 homes)
    default: false
  dhabicore.homes.admin:
    description: Admin home limit (10 homes)
    default: false
  dhabicore.homes.unlimited:
    description: Unlimited homes
    default: op
  dhabicore.staff:
    description: Staff level access (fly and moderation features)
    default: op

  dhabicore.treefeller.use:
    description: Allows using TreeFeller when permission requirement is enabled
    default: true
  dhabicore.veinminer.use:
    description: Allows using VeinMiner when permission requirement is enabled
    default: true
